<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>风和投资 3D3C3T5M 分析系统</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { font-family: "Microsoft YaHei", "PingFang SC", sans-serif; background: #f5f8fc; color: #1a2b3c; }
.header { background: linear-gradient(135deg, #1a3a6b, #2b6cb0); color: #fff; padding: 18px 28px; display: flex; align-items: center; gap: 14px; }
.header h1 { font-size: 20px; font-weight: 600; }
.header .sub { font-size: 12px; opacity: .85; margin-top: 2px; }
.logo { width: 40px; height: 40px; border-radius: 10px; background: rgba(255,255,255,.15); display: flex; align-items: center; justify-content: center; font-size: 22px; }
.wrap { max-width: 1180px; margin: 20px auto; padding: 0 16px; }
.search { display: flex; gap: 10px; background: #fff; padding: 16px; border-radius: 12px; box-shadow: 0 2px 8px rgba(43,108,176,.08); margin-bottom: 16px; }
.search input { flex: 1; padding: 10px 14px; border: 1px solid #d6e4f2; border-radius: 8px; font-size: 15px; outline: none; }
.search input:focus { border-color: #2b6cb0; box-shadow: 0 0 0 3px rgba(43,108,176,.12); }
.btn { padding: 10px 26px; background: #2b6cb0; color: #fff; border: none; border-radius: 8px; font-size: 15px; cursor: pointer; }
.btn:hover { background: #245a96; }
.btn:disabled { opacity: .6; cursor: not-allowed; }
.card { background: #fff; border-radius: 12px; box-shadow: 0 2px 8px rgba(43,108,176,.08); padding: 18px 20px; margin-bottom: 16px; }
.card h3 { font-size: 15px; color: #1a3a6b; margin-bottom: 12px; display: flex; align-items: center; gap: 8px; }
.card h3 .tag { font-size: 11px; background: #e8f0fa; color: #2b6cb0; padding: 2px 8px; border-radius: 10px; font-weight: 400; }
.top-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
.summary { display: flex; align-items: center; gap: 24px; flex-wrap: wrap; }
.score-ring { width: 130px; height: 130px; border-radius: 50%; display: flex; flex-direction: column; align-items: center; justify-content: center; background: conic-gradient(#2b6cb0 var(--score), #e8eef5 0); position: relative; }
.score-ring::before { content: ""; position: absolute; inset: 10px; background: #fff; border-radius: 50%; }
.score-ring .num { position: relative; font-size: 34px; font-weight: 700; color: #1a3a6b; }
.score-ring .lbl { position: relative; font-size: 11px; color: #7a8ea3; }
.sig-box { flex: 1; min-width: 220px; }
.sig { font-size: 26px; font-weight: 700; padding: 8px 18px; border-radius: 10px; display: inline-block; margin-bottom: 8px; }
.sig-buy { background: #e6f7ed; color: #1a7f4b; }
.sig-hold { background: #fef4e6; color: #b7791f; }
.sig-sell { background: #fde8e8; color: #c53030; }
.sig-bullish { background: #e6f2fb; color: #2b6cb0; }
.meta { font-size: 13px; color: #5a6f85; line-height: 1.9; }
.meta b { color: #1a3a6b; }
.chips { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 10px; }
.chip { font-size: 12px; padding: 4px 10px; border-radius: 14px; background: #e8f0fa; color: #2b6cb0; }
.chip.struct { background: #fef3c7; color: #92400e; }
.grid4 { display: grid; grid-template-columns: repeat(4, 1fr); gap: 14px; }
.layer { background: #f8fbfe; border: 1px solid #e3ecf5; border-radius: 10px; padding: 12px; }
.layer .name { font-size: 13px; font-weight: 700; color: #1a3a6b; margin-bottom: 8px; display: flex; justify-content: space-between; }
.layer .bar { height: 8px; background: #e8eef7; border-radius: 6px; overflow: hidden; }
.layer .bar i { display: block; height: 100%; background: linear-gradient(90deg, #2b6cb0, #63a3df); border-radius: 6px; }
.layer .w { font-size: 11px; color: #7a8ea3; margin-top: 6px; }
.sub-grid { display: grid; grid-template-columns: repeat(5, 1fr); gap: 10px; margin-top: 12px; }
.sub-item { background: #fff; border: 1px solid #eef3f9; border-radius: 8px; padding: 8px 10px; text-align: center; }
.sub-item .k { font-size: 11px; color: #7a8ea3; }
.sub-item .v { font-size: 18px; font-weight: 700; color: #1a3a6b; margin-top: 2px; }
.sub-item .d { font-size: 10px; color: #5a7f9e; margin-top: 2px; }
table { width: 100%; border-collapse: collapse; font-size: 12.5px; }
th, td { padding: 7px 8px; border-bottom: 1px solid #eef3f9; text-align: right; white-space: nowrap; }
th { color: #7a8ea3; font-weight: 600; background: #f8fbfe; }
td:first-child, th:first-child { text-align: left; }
.pos { font-size: 13px; color: #1a3a6b; line-height: 1.8; }
.pos b { font-size: 18px; color: #2b6cb0; }
.empty { text-align: center; color: #9db1c4; padding: 40px 0; font-size: 14px; }
.err { background: #fde8e8; color: #c53030; border-radius: 10px; padding: 14px 18px; margin-bottom: 16px; font-size: 14px; }
.loading { display: none; text-align: center; padding: 30px; color: #7a8ea3; }
.foot { text-align: center; color: #9db1c4; font-size: 12px; padding: 18px 0 30px; }
@media (max-width: 900px) {
  .2, .grid4 { grid-template-columns: 1fr 1fr; }
  .sub-grid { grid-template-columns: repeat(2, 1fr); }
}
</style>
</head>
<body>
<div class="header">
  <div class="logo">🌊</div>
  <div>
    <h1>风和投资 3D3C3T5M 分析系统</h1>
    <div class="sub">价值为本 · 变化为机 · 情绪为用 · 极致风控 — 胡猛《风和投资随笔》规则引擎</div>
  </div>
</div>

<div class="wrap">
  <div class="search">
    <input id="code" placeholder="输入代码，如 600900（A股） / 00700（港股） / 200596（B股）" value="600900">
    <button class="btn" id="go">开始分析</button>
  </div>

  <div id="err" class="err" style="display:none"></div>
  <div id="loading" class="loading">首次分析需 10~30 秒拉取数据，请稍候…</div>
  <div id="result"></div>
</div>

<div class="foot">数据来源：akshare（东方财富 / 同花顺 / 新浪 / 百度估值），本工具仅供研究参考，不构成投资建议</div>

<script>
const $ = s => document.querySelector(s);
let lastResult = null;

$("#code").addEventListener("keydown", e => { if (e.key === "Enter") go(); });
$("#go").addEventListener("click", go);

async function go() {
  const code = $("#code").value.trim();
  if (!code) return;
  $("#err").style.display = "none";
  $("#loading").style.display = "block";
  $("#result").innerHTML = "";
  try {
    const r = await fetch("/api/analyze?code=" + encodeURIComponent(code));
    const j = await r.json();
    $("#loading").style.display = "none";
    if (!j.ok) { showErr(j.error || "分析失败"); return; }
    render(j.result);
  } catch (e) {
    $("#loading").style.display = "none";
    showErr("请求失败: " + e.message);
  }
}

function showErr(msg) { const e = $("#err"); e.style.display = "block"; e.textContent = "分析失败：" + msg; }

function sigClass(s) {
  if (s === "买入") return "sig-buy";
  if (s === "卖出") return "sig-sell";
  if (s === "持有偏多") return "sig-bullish";
  return "sig-hold";
}

function pctLabel(v) { return v == null ? "—" : v.toFixed(1) + "%"; }
function numLabel(v, d=2) { return v == null ? "—" : Number(v).toFixed(d); }

function render(r) {
  const s = r.scores, h = r.hist;
  const marketName = {A:"A股", B:"B股", HK:"港股"}[r.market] || r.market;
  const yoyCol = r.market === "HK" ? "pe_pct_3y" : "pe_pct_3y";
  const posPct = (r.score_total / 10 * 100).toFixed(0);

  let html = `
  <div class="card">
    <div class="summary">
      <div class="score-ring" style="--score:${r.score_total * 10}%">
        <div class="num">${r.score_total.toFixed(1)}</div>
        <div class="lbl">综合评分</div>
      </div>
      <div class="sig-box">
        <span class="sig ${sigClass(r.signal)}">${r.signal}</span>
        <div class="meta">
          <b>${esc(r.name)}</b>（${r.code} · ${marketName}）<br>
          建议仓位上限：<b>${r.max_position}%</b> · 置信度：<b>${r.confidence}%</b><br>
          ${esc(r.advice)}
        </div>
        <div class="chips">
          ${r.structural ? '<span class="chip struct">🧭 结构性机会候选（风停了自己飞）</span>' : ""}
          ${(r.growth_signals || []).map(x => `<span class="chip">${esc(x)}</span>`).join("")}
        </div>
      </div>
    </div>
  </div>

  <div class="grid4">
    <div class="layer"><div class="name">3C 哲学 <span>${num(s["3c"])}</span></div><div class="bar"><i style="width:${s["3c"]*10}%"></i></div><div class="w">周期 / 变化 / 确定性</div></div>
    <div class="layer"><div class="name">3D 驱动 <span>${num(s["3d"])}</span></div><div class="bar"><i style="width:${s["3d"]*10}%"></i></div><div class="w">价值为本 / 变化为机 / 情绪为用</div></div>
    <div class="layer"><div class="name">5M 价值 <span>${num(s["5m"])}</span></div><div class="bar"><i style="width:${s["5m"]*10}%"></i></div><div class="w">市场 / 份额 / 利润率 / 模式 / 团队</div></div>
    <div class="layer"><div class="name">3T 时间 <span>${num(s["3t"])}</span></div><div class="bar"><i style="width:${s["3t"]*10}%"></i></div><div class="w">短期 / 中期 / 长期</div></div>
  </div>

  <div class="card">
    <h3>5M 价值拆解 <span class="tag">围绕 ROE</span></h3>
    <div class="sub-grid">
      <div class="sub-item"><div class="k">M1 目标市场</div><div class="v">${num(s.m1)}</div><div class="d">营收增速 ${pctLabel(hRevYoy(r))}</div></div>
      <div class="sub-item"><div class="k">M2 市场份额</div><div class="v">${num(s.m2)}</div><div class="d">增速扩张</div></div>
      <div class="sub-item"><div class="k">M3 利润率</div><div class="v">${num(s.m3)}</div><div class="d">OPM</div></div>
      <div class="sub-item"><div class="k">M4 商业模式</div><div class="v">${num(s.m4)}</div><div class="d">净利率/负债</div></div>
      <div class="sub-item"><div class="k">M5 管理团队</div><div class="v">${num(s.m5)}</div><div class="d">执行力/治理</div></div>
    </div>
  </div>

  <div class="card">
    <h3>3D 驱动拆解</h3>
    <div class="sub-grid">
      <div class="sub-item"><div class="k">D1 价值为本（内延）</div><div class="v">${num(s.d1)}</div><div class="d">ROE 内生成长</div></div>
      <div class="sub-item"><div class="k">D2 变化为机（外延）</div><div class="v">${num(s.d2)}</div><div class="d">增速/结构</div></div>
      <div class="sub-item"><div class="k">D3 情绪为用（估值）</div><div class="v">${num(s.d3)}</div><div class="d">PE分位 ${pctLabel(h.pe_pct_3y)}</div></div>
      <div class="sub-item"><div class="k">3C 确定性</div><div class="v">${num(s["3c"])}</div><div class="d">周期/变化/确定性</div></div>
      <div class="sub-item"><div class="k">风控仓位</div><div class="v">${r.max_position}%</div><div class="d">单票上限</div></div>
    </div>
  </div>

  <div class="card">
    <h3>行情与估值</h3>
    <table>
      <tr><th>最新价</th><th>涨跌幅</th><th>MA20</th><th>MA60</th><th>距52周高</th><th>PE(TTM)</th><th>PB</th><th>PE 3年分位</th><th>PB 3年分位</th><th>1月动量</th><th>1年动量</th></tr>
      <tr>
        <td>${num(h.price)}</td><td>${pctLabel(h.change_pct)}</td>
        <td>${num(h.ma20)}</td><td>${num(h.ma60)}</td>
        <td>${pctLabel(h.off_high_pct)}</td>
        <td>${num(h.pe_ttm)}</td><td>${num(h.pb)}</td>
        <td>${pctLabel(h.pe_pct_3y)}</td><td>${pctLabel(h.pb_pct_3y)}</td>
        <td>${pctLabel(h.mom_1m)}</td><td>${pctLabel(h.mom_1y)}</td>
      </tr>
    </table>
  </div>

  <div class="card">
    <h3>财务摘要（近 ${Math.min(8, (r.financials||[]).length)} 期）</h3>
    <div style="overflow-x:auto">
    <table>
      <tr><th>报告期</th><th>ROE%</th><th>净利率%</th><th>毛利率%</th><th>负债率%</th><th>营收增速%</th><th>净利增速%</th><th>EPS</th></tr>
      ${(r.financials || []).slice(0, 8).map(f => `<tr>
        <td>${esc(f.period||"")}</td><td>${num(f.roe)}</td><td>${num(f.net_margin)}</td>
        <td>${num(f.gross_margin)}</td><td>${num(f.debt_ratio)}</td>
        <td>${pctLabel(f.rev_yoy)}</td><td>${pctLabel(f.np_yoy)}</td><td>${num(f.eps)}</td>
      </tr>`).join("")}
    </table>
    </div>
  </div>

  <div class="card">
    <h3>3T 时间框架建议</h3>
    <div class="sub-grid">
      <div class="sub-item"><div class="k">T1（0-3月）</div><div class="v">${num(s.t1)}</div><div class="d">短期动量</div></div>
      <div class="sub-item"><div class="k">T2（3-15月）</div><div class="v">${num(s.t2)}</div><div class="d">业绩兑现</div></div>
      <div class="sub-item"><div class="k">T3（15月+）</div><div class="v">${num(s.t3)}</div><div class="d">长期ROE复利</div></div>
      <div class="sub-item" style="grid-column: span 2"><div class="k">胡猛心法</div><div class="d" style="font-size:12px; line-height:1.7">确定性是投资的唯一标准；风险控制是收益率的前提；跌破买入价 8% 止损观察，组合保持 20-40 只分散。</div></div>
    </div>
  </div>`;

  $("#result").innerHTML = html;
}

function num(v) { return v == null || v === "" || isNaN(v) ? "—" : v; }
function pctLabel(v) { return v == null ? "—" : Number(v).toFixed(1) + "%"; }
function esc(s) { return String(s == null ? "" : s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c])); }
function sigClass(s) { return s === "买入" ? "sig-buy" : s === "卖出" ? "sig-sell" : s === "持有偏多" ? "sig-bullish" : "sig-hold"; }
function hRevYoy(r) { return r.financials && r.financials[0] ? r.financials[0].rev_yoy : null; }
</script>
</body>
</html>
